name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: Validate canonical study contract
        run: python -m gpu_scheduler_lab study validate --config study/study.yaml
      - name: Run and resume small canonical study fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m gpu_scheduler_lab study run --config study/study-small.yaml
          python -m gpu_scheduler_lab study run --config study/study-small.yaml
      - name: Pytest
        run: pytest
      - name: Build and install wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m build --wheel
          python -m venv build/wheel-smoke-venv
          build/wheel-smoke-venv/bin/python -m pip install dist/*.whl
          build/wheel-smoke-venv/bin/gpu-scheduler-lab --help >/dev/null
          build/wheel-smoke-venv/bin/python - <<'PY'
          import importlib.metadata

          import gpu_scheduler_lab

          assert importlib.metadata.version("gpu-scheduler-lab") == gpu_scheduler_lab.__version__
          PY
      - name: Benchmark smoke
        run: >-
          python -m gpu_scheduler_lab compare
          --scenario scenarios/demo.yaml
          --schedulers fifo,binpack,spread,preemptive
          --output-dir build/smoke
      - name: Phase II topology smoke
        run: >-
          python -m gpu_scheduler_lab compare
          --scenario scenarios/topology.yaml
          --schedulers spread,topology
          --output-dir build/topology-smoke
      - name: Phase II backfill smoke
        run: >-
          python -m gpu_scheduler_lab compare
          --scenario scenarios/backfill.yaml
          --schedulers fifo,backfill
          --output-dir build/backfill-smoke
      - name: Trace fixture smoke
        run: >-
          python -m gpu_scheduler_lab trace-import
          --format alibaba
          --input tests/fixtures/alibaba_trace_sample
          --max-jobs 2
          --gpu-memory GPU-series-1=24
          --output build/alibaba-sample.yaml
      - name: Phase III borrowing and reclaim smoke
        run: python -m gpu_scheduler_lab experiment --config experiments/phase3-borrow-reclaim.yaml
      - name: Phase III historical fair-share smoke
        run: python -m gpu_scheduler_lab experiment --config experiments/phase3-historical-fairshare.yaml
      - name: Phase III elastic gang smoke
        run: python -m gpu_scheduler_lab experiment --config experiments/phase3-elastic.yaml
      - name: Phase III revocable fleet smoke
        run: python -m gpu_scheduler_lab experiment --config experiments/phase3-revocable-fleet.yaml
