metadata:
  name: revocable-fleet
nodes:
  - id: stable
    gpus:
      - {id: s0, memory_gb: 40}
      - {id: s1, memory_gb: 40}
  - id: spot
    revocable: true
    gpus:
      - {id: p0, memory_gb: 40}
      - {id: p1, memory_gb: 40}
queues:
  - id: training
    parent: root
    guaranteed: {gpu_units: 4}
    limit: {gpu_units: 4}
fleet_events:
  - {time: 3, type: CAPACITY_REVOKE, node_id: spot}
  - {time: 8, type: CAPACITY_RETURN, node_id: spot}
jobs:
  - id: fleet-training
    queue: training
    arrival_time: 0
    duration: 10
    gpu_count: 4
    gpu_memory_gb: 20
    type: training
    gang: true
    restart_cost: 1
