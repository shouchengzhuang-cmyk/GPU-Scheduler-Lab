[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-scheduler-lab"
version = "0.2.0"
description = "Deterministic discrete-event GPU scheduling simulator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "shouchengzhuang-cmyk" }]
dependencies = [
  "matplotlib>=3.9,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff==0.16.4",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
gpu-scheduler-lab = "gpu_scheduler_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gpu_scheduler_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gpu_scheduler_lab"]
